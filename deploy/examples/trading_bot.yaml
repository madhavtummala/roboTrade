accounts:
  default: paper
  items:
    paper:
      label: Alpaca Paper
      broker: alpaca
      api_key_env: ALPACA_API_KEY
      api_secret_env: ALPACA_API_SECRET
      base_url: https://paper-api.alpaca.markets
      data_feed: iex
    live:
      label: Alpaca Live
      broker: alpaca
      api_key_env: ALPACA_LIVE_API_KEY
      api_secret_env: ALPACA_LIVE_API_SECRET
      base_url: https://api.alpaca.markets
      data_feed: iex

