<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DCA Bubbles</title>
  <link rel="stylesheet" href="/static/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
</head>

<body data-pnl="flat">
  <main>
    <svg id="bubbleBoard" role="img" aria-label="Interactive buy and sell DCA bubbles"></svg>

    <section id="statsPanel" aria-label="Account and trading controls">
      <menu id="switches">
        <label><input id="dcaEnabled" type="checkbox" /> DCA</label>
        <label><input id="algorithmEnabled" type="checkbox" /> Algorithm</label>
        <label><input id="optionsEnabled" type="checkbox" /> Options</label>
      </menu>

      <section id="numbers" aria-label="Account statistics">
        <p>
          <span>Equity</span>
          <strong id="equity">--</strong>
        </p>
        <p>
          <span>Cash</span>
          <strong id="cash">--</strong>
        </p>
        <p>
          <span>Day P/L</span>
          <strong id="dayPl">--</strong>
        </p>
        <p>
          <span>Total P/L</span>
          <strong id="totalPl">--</strong>
        </p>
      </section>

      <section id="cronPanel" aria-label="DCA scheduling">
        <h2>Schedule</h2>
        <div id="cronConfig">
          <input type="text" id="cronPattern" placeholder="0 12 * * 1-5" aria-label="Cron pattern for DCA scheduling" />
          <p id="cronDescription">Weekdays at 12:00 PM</p>
        </div>
      </section>

      <section id="growthPanel" aria-label="Total growth over time">
        <h2>Total Growth</h2>
        <svg id="growthChart" role="img" aria-label="Portfolio equity growth chart"></svg>
      </section>

      <section id="ordersPanel" aria-label="Today's orders">
        <h2>Orders</h2>
        <table>
          <thead>
            <tr>
              <th>Symbol</th>
              <th>Side</th>
              <th>Qty/Value</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="ordersBody">
            <tr>
              <td colspan="4">Loading orders</td>
            </tr>
          </tbody>
        </table>
      </section>

      <section id="positionsPanel" aria-label="Current positions">
        <h2>Positions</h2>
        <table>
          <thead>
            <tr>
              <th>Symbol</th>
              <th>Qty</th>
              <th>Value</th>
              <th>P/L</th>
            </tr>
          </thead>
          <tbody id="positionsBody">
            <tr>
              <td colspan="4">Loading positions</td>
            </tr>
          </tbody>
        </table>
      </section>
    </section>
  </main>

  <input id="symbolEntry" autocomplete="off" autocapitalize="characters" spellcheck="false" />
  <output id="toast" aria-live="polite"></output>
  <script src="/static/app.js"></script>
</body>

</html>
