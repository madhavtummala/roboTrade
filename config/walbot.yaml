default: paper
accounts:
  items:
    paper:
      label: Alpaca Paper
      broker: alpaca
      api_key_env: ALPACA_API_KEY
      api_secret_env: ALPACA_API_SECRET
      base_url: https://paper-api.alpaca.markets
      data_feed: iex
    schwab_individual:
      label: Schwab Individual
      broker: schwab
      schwab_account_number: 3959-7066
    local_paper:
      label: Local Paper
      broker: paper
data_sources:
  intraday_market_data:
    provider_order:
    - schwab
    providers:
      schwab: {}
  eod_market_data:
    provider_order:
    - schwab
    providers:
      schwab: {}
  streaming_market_data:
    providers:
      schwab: {}
  sentiment_data:
    providers: null
  dividends:
    providers:
      alpaca:
        api_key_env: ALPACA_API_KEY
        api_secret_env: ALPACA_API_SECRET
      yfinance: {}
tradable_universe:
  master_list: data/tradable_etfs.csv
  symbols:
  - ASHR
  - BIL
  - EWC
  - EWJ
  - GLD
  - GPIX
  - HYG
  - IAU
  - IBIT
  - IEMG
  - IJH
  - INDA
  - IWM
  - IWO
  - JEPQ
  - KBE
  - KRE
  - PBW
  - QQQM
  - QUAL
  - RSP
  - SCHD
  - SCZ
  - SGOV
  - SH
  - SLV
  - SPYM
  - TLT
  - UNG
  - USMV
  - USO
  - VEA
  - VGK
  - VTEB
  - VTV
  - VXUS
  - VXX
  - XBI
  - XOP
  - XRT
  - XSD
  - XYLD
algorithm_bot:
  trading_account_id: paper
  strategy: bursty_dca
  backtest_period: 3m
  bindings:
  - id: b2
    strategy: bursty_dca
    account_id: schwab_individual
    enabled: true
    cron: 0 11 * * 1-5
  - id: b4
    strategy: rally_rotation
    account_id: paper
    enabled: true
    cron: '*/30 10-15 * * 1-5'
  - id: b5
    strategy: options_flip
    account_id: paper
    enabled: true
    cron: '*/15 10-15 * * 1-5'
  enabled: true
algorithms:
  bursty_dca:
    regime_ma_days: 150
    scaling_factor: 0.5
    max_monthly_multiple: 3
    relax_months: 3
    relax_depth: 0.7
    plan:
      buy:
        amount: 1000
        items:
        - symbol: IAU
          amount: 250
        - symbol: XBI
          amount: 250
        - symbol: SPYM
          amount: 500
      sell:
        amount: 1000
        items:
        - symbol: XSD
          amount: 1000
  rally_rotation:
    risk_on_universe:
    - QQQM
    - XSD
    - XBI
    - VEA
    - USO
    - IAU
    - IEMG
    - SLV
    - KRE
    - XRT
    - IWM
    - IBIT
    defensive_universe:
    - SGOV
    max_positions: 3
    entry_rank_max: 3
    exit_rank_max: 6
    rerank_interval_days: 5
    min_base_score: 0
    entry_min_eligible_days: 3
    selection_horizon_macro_minutes: 7800
    volatility_tilt: -0.5
    vol_ceiling: 0.5
    vol_rising_threshold: 0.3
    rebalance_weight_threshold: 0.08
    range_expansion_limit: 2
    climax_ma_distance_min: 0.15
    climax_volume_ratio_min: 1.5
    trend_ma_days: 0
    trend_return_days: 0
  options_flip:
    symbols:
    - IAU
    - IBIT
    trend_ma_period: 20
    trend_min_return: 0.005
    premarket_confirm_min: 0.25
    min_dte: 5
    target_delta: 0.75
    min_open_interest: 50
    target_fill_probability: 0.6
    entry_decay_power: 0.25
    stop_loss_pct: 0.1
    exit_fill_probability: 0.75
    max_hold_sessions: 3
    max_annual_volatility: 0.8
    excursion_lookback_days: 20
    min_expected_profit: 50
    contracts_per_position: 1
    max_notional_per_trade: 1000
