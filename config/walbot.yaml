algorithm_bot:
  trading_account_id: paper
  strategy: bursty_dca
  backtest_period: 3m
  require_trade_approval: false
  trade_approval_timeout_seconds: 300
  trade_approval_poll_seconds: 5
  bindings:
  - id: b2
    strategy: bursty_dca
    account_id: schwab_individual
    enabled: true
    frequency: 1d
  - id: b4
    strategy: rally_rotation
    account_id: paper
    enabled: true
    frequency: 1hr
  - id: b5
    strategy: intraday_pick
    account_id: local_paper
    enabled: false
    frequency: 15m
  enabled: true
algorithms:
  bursty_dca:
    regime_ma_days: 150
    scaling_factor: 20
    cap_boost: 1
    max_monthly_multiple: 3
    plan:
      buy:
        amount: 2000
        items:
        - symbol: XSD
          amount: 500
        - symbol: SPY
          amount: 500
        - symbol: XBI
          amount: 500
        - symbol: GLD
          amount: 500
      sell:
        amount: 0
        items: []
  rally_rotation:
    risk_on_universe:
    - QQQM
    - XSD
    - XBI
    - KRE
    - XRT
    - GLD
    - IWM
    - SLV
    - VXUS
    defensive_universe:
    - SGOV
    max_positions: 3
    entry_rank_max: 3
    exit_rank_max: 6
    rerank_interval_days: 5
    min_base_score: 0
    entry_min_eligible_days: 3
    selection_horizon_macro_minutes: 7800
    volatility_tilt: -0.5
    vol_ceiling: 0.5
    vol_rising_threshold: 0.3
    rebalance_weight_threshold: 0.08
    range_expansion_limit: 2.0
    climax_ma_distance_min: 0.15
    climax_volume_ratio_min: 1.5
    trend_ma_days: 0
    trend_return_days: 0
  dca:
    plan:
      buy:
        amount: 2000
        items:
        - symbol: SPY
          amount: 500
        - symbol: GLD
          amount: 500
        - symbol: XBI
          amount: 500
        - symbol: XSD
          amount: 500
      sell:
        amount: 0
        items: []
  intraday_pick:
    benchmark_symbol: SPY
    candidate_symbols:
    - XSD
    force_option_type: call
    trend_ma_period: 50
    trend_lookback_days: 5
    contracts_per_signal: 1
    max_notional_per_trade: 1000
    entry_discount_pct: 0.05
    exit_target_pct: 0.3
    vol_short_window: 5
    vol_long_window: 20
    range_expansion_threshold: 1.0
    intraday_bar_minutes: 5
    min_price: 50
    max_price: 1000
