algorithm_bot:
  trading_account_id: paper
  strategy: bursty_dca
  backtest_period: 3m
  bindings:
  - id: b2
    strategy: bursty_dca
    account_id: alpaca1
    enabled: false
    cron: 0 11 * * 1-5
  - id: b4
    strategy: rally_rotation
    account_id: alpaca1
    enabled: false
    cron: '*/30 10-15 * * 1-5'
  - id: b5
    strategy: options_flip
    account_id: alpaca1
    enabled: false
    cron: '*/5 10-15 * * 1-5'
  enabled: false
algorithms:
  bursty_dca:
    regime_ma_days: 150
    scaling_factor: 0.5
    max_monthly_multiple: 3
    relax_months: 3
    relax_depth: 0.7
    plan:
      buy:
        amount: 1300
        items:
        - symbol: XBI
          amount: 150
        - symbol: GTEK
          amount: 150
        - symbol: QQQM
          amount: 400
        - symbol: IAUM
          amount: 150
        - symbol: SPYM
          amount: 450
      sell:
        amount: 0
        items: []
  rally_rotation:
    risk_on_universe:
    - QQQM
    - XSD
    - XBI
    - VEA
    - USO
    - IAUM
    - IEMG
    - SLV
    - KRE
    - XRT
    - IWM
    - IBIT
    defensive_universe:
    - SGOV
    max_positions: 3
    entry_rank_max: 3
    exit_rank_max: 6
    rerank_interval_days: 5
    entry_min_eligible_days: 1
    volatility_tilt: -0.5
    vol_ceiling: 0.5
    rebalance_weight_threshold: 0.08
    nano_days: 1
    micro_days: 2
    meso_days: 3
    macro_days: 20
  options_flip:
    symbols:
    - XSD
    - IBIT
    - GLD
    contracts_per_trade: 1
    stop_loss_pct: 0
    max_hold_sessions: 4
    target_reach: 0.42
    exit_gain_share: 0.7
    exit_patience: 0.7
    entry_reach: 0.55
    entry_patience: 1.5
    min_profit_per_contract: 15
    target_delta: 0.6
    level_lookback_days: 80
    min_trend_strength: 0.5
    max_notional_per_trade: 1500
    min_dte: 7
    min_open_interest: 100
    max_spread_pct: 0.06
    max_gap_down_atr: 1
    max_annual_volatility: 0.8
