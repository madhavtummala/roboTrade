default: alpaca1
accounts:
  items:
    alpaca1:
      label: Alpaca Paper
      broker: alpaca
      api_key_env: ALPACA_API_KEY
      api_secret_env: ALPACA_API_SECRET
      base_url: https://paper-api.alpaca.markets
      data_feed: iex
    schwab1:
      label: Schwab Main
      broker: schwab
      schwab_account_number: 8540-2329
    schwab2:
      label: Schwab Small
      broker: schwab
      schwab_account_number: 3959-7066
    local_paper:
      label: Local Paper
      broker: paper
data_sources:
  intraday_market_data:
    provider_order:
    - schwab
    providers:
      schwab: {}
  eod_market_data:
    provider_order:
    - schwab
    providers:
      schwab: {}
  streaming_market_data:
    providers:
      schwab: {}
  sentiment_data:
    providers: null
  dividends:
    providers:
      alpaca:
        api_key_env: ALPACA_API_KEY
        api_secret_env: ALPACA_API_SECRET
      yfinance: {}
