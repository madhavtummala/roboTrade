# Walbot configuration -- one file, one mount, one thing to copy.
#
# Every section used to be its own file (accounts.yaml, connectors.yaml, dca_bot.yaml and
# four more). The top-level keys never overlapped, so they merge here unchanged: the shapes
# below are exactly what the loaders and the dashboard already read and write.
#
# Comments are lost whenever the dashboard saves -- it rewrites this file through yaml.dump.
# Durable documentation for algorithm knobs lives in src/algorithms/explainers.py, which the
# Tune tab renders.
default: paper
accounts:
  items:
    paper:
      label: Alpaca Paper
      broker: alpaca
      api_key_env: ALPACA_API_KEY
      api_secret_env: ALPACA_API_SECRET
      base_url: https://paper-api.alpaca.markets
      data_feed: iex
    schwab_individual:
      # Individual brokerage account. Reachable once Schwab consent is complete -- the
      # account number is resolved to Schwab's opaque hash on first use.
      label: Schwab Individual
      broker: schwab
      schwab_account_number: 3959-7066
    local_paper:
      label: Local Paper
      broker: paper
data_sources:
  intraday_market_data:
    providers:
      schwab: {}
      # yfinance: {}
  eod_market_data:
    providers:
      # Schwab first, as with intraday: no rate limits, and four years of daily history.
      # /pricehistory returns raw prices, which is exactly what is wanted -- cached bars are a
      # record of what the market printed and are never adjusted here. Distributions are cash
      # events instead: fetched into the `dividends` table (see data_sources.dividends), booked
      # as income by the ledger, and compounded on demand for the momentum signal.
      schwab: {}
      # Alpaca stays as the fallback, over six years. Note it serves Adjustment.ALL, so its
      # closes are total-return rather than raw -- the one feed whose `adjusted_close` is its
      # own and not something this project derived.
      # alpaca:
      #   api_key_env: ALPACA_API_KEY
      #   api_secret_env: ALPACA_API_SECRET
      # yfinance: {}
  sentiment_data:
    providers: null
  dividends:
    providers:
      # Alpaca first: real ex-date/payable-date events from the corporate-actions
      # API. yfinance is the no-credentials fallback; it only reports the ex-date.
      alpaca:
        api_key_env: ALPACA_API_KEY
        api_secret_env: ALPACA_API_SECRET
      yfinance: {}

notifications:
  providers:
    telegram:
      enabled: false
      bot_token: ''
      chat_id: ''
      api_root: https://api.telegram.org
      timeout_seconds: 5
tradable_universe:
  master_list: data/tradable_etfs.csv
  # A deliberately wider pool than any one algorithm trades: broad US, sectors,
  # factors, international, commodities, crypto, credit and defensives. Screened from
  # data/tradable_etfs.csv on 60-day median dollar volume (>= $1M on the IEX feed) and
  # on having enough history for a 100-day gate, so anything here can actually be
  # filled and scored. It decides what gets priced and cached, which is what makes a
  # universe change a config edit rather than a data-gathering exercise.
  #
  # The defensive tier is deliberately thin. Measured on daily returns since 2023,
  # BIL/SGOV/USFR correlate 0.95-0.99 at an identical 1.2% annual volatility, and IEF/AGG
  # correlate 0.98 -- so USFR, IEF and AGG were dropped as duplicates rather than as
  # opinions. What remains spans genuinely different exposures: SGOV and BIL for cash,
  # TLT for duration (correlation -0.10 to cash, 14.2% vol), HYG for credit (0.42-0.46
  # against everything, and it falls *with* equities, so it is not a hiding place).
  #
  # VTEB is the one holding here chosen for tax rather than for signal: federally exempt
  # municipal income, which only pays off in the taxable Schwab account and only if held
  # long enough to earn it. It carries ~6-7 years of duration, so it is not a cash
  # substitute, and rotating it on a momentum horizon would realise short-term gains that
  # outweigh the exemption. Route it through DCA, not a defensive_universe.
  symbols:
  - ASHR
  - BIL
  - EWC
  - EWJ
  - GLD
  - GPIX
  - HYG
  - IBIT
  - IEMG
  - IJH
  - INDA
  - IWM
  - IWO
  - JEPQ
  - KBE
  - KRE
  - PBW
  - QQQM
  - QUAL
  - RSP
  - SCHD
  - SCZ
  - SGOV
  - SH
  - SLV
  - SPY
  - TLT
  - UNG
  - USMV
  - USO
  - VGK
  - VTEB
  - VTV
  - VXX
  - XBI
  - XOP
  - XRT
  - XSD
  - XYLD
algorithm_bot:
  trading_account_id: paper
  strategy: dca
  backtest_period: 3m
  require_trade_approval: false
  trade_approval_timeout_seconds: 300
  trade_approval_poll_seconds: 5
  bindings:
  - id: b2
    strategy: dca
    account_id: paper
    enabled: false
    frequency: 1hr
  - id: b1
    strategy: fast_momentum
    account_id: paper
    enabled: false
    frequency: 1hr
  - id: b3
    strategy: bursty_dca
    account_id: paper
    enabled: false
    frequency: 1hr
  - id: b4
    strategy: dual_momentum
    account_id: schwab_individual
    enabled: false
    frequency: 1hr
algorithms:
  bursty_dca:
    regime_ma_days: 200
    percent_b_lookback: 20
    percent_b_threshold: 0.0
    rsi_lookback: 2
    # 5 rather than 10: same 12M return, but far better over 6M (13.7% against 0.2%)
    # and 3M, at a third of the drawdown. Being pickier about what counts as a dip
    # left it holding cash through the falls it used to buy into.
    rsi_threshold: 5.0
    max_trade_multiple: 3.0
    max_monthly_multiple: 3.0
    value_averaging: true
  fast_momentum:
    risk_on_universe:
    - QQQM
    - XSD
    - XBI
    - XOP
    - KRE
    - XRT
    - IJH
    - IEMG
    - EWJ
    - VGK
    - GLD
    - IBIT
    - USO
    defensive_universe:
    - SGOV
    max_positions: 4
    max_single_position_weight: 0.5
    max_gross_exposure: 0.95
    # 0.35 rather than 0.10: measured better on every window -- +4pp at 6M with a
    # smaller drawdown and fewer orders. It churned between near-identical scores.
    min_score_delta_to_replace: 0.35
    pullback_min_micro_return: -0.02
    min_risk_on_micro_return: 0.01
  dual_momentum:
    risk_on_universe:
    - QQQM
    - XSD
    - XBI
    - XOP
    - KRE
    - XRT
    - IJH
    - IEMG
    - EWJ
    - VGK
    - GLD
    - IBIT
    - USO
    - SPY
    - IWM
    - RSP
    - QUAL
    - VTV
    - SCHD
    - SLV
    defensive_universe:
    - SGOV
    benchmark: QQQM
    breadth_min: 0.5
    regime_confirm_bars: 2
    regime_exit_confirm_bars: 2
    etf_min_abs_return: 0
    etf_min_fast_return: -0.02
    risk_adjusted_score: false
    max_positions: 8
    entry_rank_max: 8
    exit_rank_max: 10
    rebalance_weight_threshold: 0.08
    cash_buffer: 0.08
    min_base_score: 0.0
    min_score_delta_to_replace: 0.35
    momentum_change_enter: 0
    cooldown_after_exit: 4
    volatility_tilt: -1.0
    name_weight_max: 0.5
    risk_on_gross_max: 1
    target_portfolio_vol: 0.3
    high_vol_trigger: 1.3
    intraday_drawdown_limit: -0.015
    sentiment_size_scale: 0
  invest_spy:
    spy_symbol: SPY
    equity_income_universe:
    - XYLD
    - GPIX
    defensive_universe:
    - BIL
    crisis_hedge_universe:
    - SH
    - VXX
    flat_equity_income_exposure: 0.5
    max_crisis_hedge_exposure: 0.15
dca_bot:
  dca_plan:
    max_item_amount: 2000.0
    buy:
      amount: 2675.0
      items:
      - symbol: XSD
        amount: 1600.0
      - symbol: GLD
        amount: 1075.0
    sell:
      amount: 0
      items: []
  dca_plans:
    paper:
      max_item_amount: 2000.0
      buy:
        amount: 2675.0
        items:
        - symbol: GLD
          amount: 1075.0
        - symbol: XSD
          amount: 1600.0
      sell:
        amount: 0
        items: []
options_bot:
  strategy: none
  account_id: paper
options:
  swing_dte_min: 30
  swing_dte_max: 60
  swing_min_delta: 0.35
  swing_max_delta: 0.65
  swing_max_contracts: 1
  swing_max_premium: 500.0
  swing_min_open_interest: 100
  swing_max_spread_pct: 0.2
  swing_strike_range_pct: 0.15
