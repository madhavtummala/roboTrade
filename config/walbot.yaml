default: paper
accounts:
  items:
    paper:
      label: Alpaca Paper
      broker: alpaca
      api_key_env: ALPACA_API_KEY
      api_secret_env: ALPACA_API_SECRET
      base_url: https://paper-api.alpaca.markets
      data_feed: iex
    schwab_individual:
      label: Schwab Individual
      broker: schwab
      schwab_account_number: 3959-7066
    local_paper:
      label: Local Paper
      broker: paper
data_sources:
  intraday_market_data:
    providers:
      schwab: {}
  eod_market_data:
    providers:
      schwab: {}
  streaming_market_data:
    providers:
      schwab: {}
  sentiment_data:
    providers: null
  dividends:
    providers:
      alpaca:
        api_key_env: ALPACA_API_KEY
        api_secret_env: ALPACA_API_SECRET
      yfinance: {}
notifications:
  providers:
    telegram:
      enabled: false
      bot_token: ''
      chat_id: ''
      api_root: https://api.telegram.org
      timeout_seconds: 5
