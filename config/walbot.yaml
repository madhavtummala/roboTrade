algorithm_bot:
  trading_account_id: paper
  strategy: dca
  backtest_period: 3m
  require_trade_approval: false
  trade_approval_timeout_seconds: 300
  trade_approval_poll_seconds: 5
  bindings:
  - id: b2
    strategy: dca
    account_id: local_paper
    enabled: false
    frequency: 1hr
  - id: b3
    strategy: bursty_dca
    account_id: local_paper
    enabled: false
    frequency: 1hr
  - id: b4
    strategy: rally_rotation
    account_id: paper
    enabled: true
    frequency: 1hr
  enabled: false
algorithms:
  bursty_dca:
    regime_ma_days: 150
    percent_b_lookback: 20
    percent_b_threshold: 0
    rsi_lookback: 2
    rsi_threshold: 20
    max_trade_multiple: 2
    max_monthly_multiple: 3
    value_averaging: true
    backlog_relax_months: 3
    reversal_multiplier: 1.5
    reversal_ma_days: 10
    plan:
      buy:
        amount: 2000
        items:
        - symbol: XSD
          amount: 500
        - symbol: SPY
          amount: 500
        - symbol: XBI
          amount: 500
        - symbol: GLD
          amount: 500
      sell:
        amount: 0
        items: []
  rally_rotation:
    risk_on_universe:
    - QQQM
    - XSD
    - XBI
    - KRE
    - XRT
    - GLD
    - IWM
    - SLV
    defensive_universe:
    - SGOV
    max_positions: 3
    entry_rank_max: 3
    exit_rank_max: 6
    rerank_interval_days: 5
    min_base_score: 0
    entry_min_eligible_days: 3
    selection_horizon_macro_minutes: 7800
    volatility_tilt: -0.5
    vol_ceiling: 0.5
    vol_rising_threshold: 0.3
    rebalance_weight_threshold: 0.08
    range_expansion_limit: 2.0
    climax_ma_distance_min: 0.15
    climax_volume_ratio_min: 1.5
    trend_ma_days: 0
    trend_return_days: 0
  dca:
    plan:
      buy:
        amount: 2000
        items:
        - symbol: SPY
          amount: 500
        - symbol: GLD
          amount: 500
        - symbol: XBI
          amount: 500
        - symbol: XSD
          amount: 500
      sell:
        amount: 0
        items: []
options_bot:
  strategy: none
  account_id: paper
  enabled: false
options:
  swing_dte_min: 30
  swing_dte_max: 60
  swing_min_delta: 0.35
  swing_max_delta: 0.65
  swing_max_contracts: 1
  swing_max_premium: 500.0
  swing_min_open_interest: 100
  swing_max_spread_pct: 0.2
  swing_strike_range_pct: 0.15
